name: Daily Email Sender

on:
  schedule:
    - cron: '0 5,17 * * *' # 05:00 and 17:00 UTC -> 08:00 and 20:00 TSI
  workflow_dispatch: # Manuel tetikleme için
  repository_dispatch:
    types: [trigger-daily-emails] # Dışarıdan %100 dakik tetiklemek için webhook

jobs:
  send-emails:
    runs-on: ubuntu-latest
    permissions:
      contents: write # trainers-db.json'ı geri commit edebilmek için gerekli

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./automation
        run: npm ci

      - name: Run Email Script
        working-directory: ./automation
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          LIMIT: 10
        run: node send-emails.js

      - name: Run IMAP Check (Check Replies)
        working-directory: ./automation
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
        run: node check-replies.js

      - name: Run Follow-Up Script
        working-directory: ./automation
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: node follow-up.js

      - name: Commit and Push DB Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add automation/trainers-db.json
          git commit -m "Auto-update sent emails in trainers-db.json" || echo "No changes to commit"
          git pull --rebase
          git push
